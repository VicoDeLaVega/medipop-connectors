name: medipop_supabase
description: Supabase adapters for Medipop — email/password identity with organization membership, organization-managed packages and RPC synchronization.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  medipop_core:
    git:
      url: https://github.com/VicoDeLaVega/medipop-core.git
      ref: main
  supabase_flutter: ^2.10.3
  shared_preferences: ^2.5.5
  http: ^1.6.0

dev_dependencies:
  flutter_lints: ^4.0.0
